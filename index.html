<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora – VDF Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Technická podpora – VDF Games</h1>
        <p>Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>

        <form id="supportForm">
            <div class="form-group">
                <label for="dotaz">Tvůj dotaz:</label>
                <textarea id="dotaz" name="dotaz" placeholder="Např.: Po poslední aktualizaci se mi hra nespustí..."></textarea>
            </div>

            <div class="form-group">
                <label for="email">E-mail (nepovinné):</label>
                <input type="email" id="email" name="email" placeholder="test@email.cz">
            </div>

            <button type="submit">Odeslat dotaz</button>
        </form>

        <div class="support-response">
            <h2>Odpověď podpory:</h2>
            <div class="response-box" id="responseBox">
                Zatím žádný dotaz.
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
